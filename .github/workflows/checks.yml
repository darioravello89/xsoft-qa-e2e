name: Validaciones del framework

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    name: Framework y catálogo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Instalar herramientas
        run: python -m pip install -r requirements/dev.txt
      - name: Revisar Python
        run: python -m ruff check .
      - name: Revisar Robot
        run: python -m robocop check products
      - name: Probar infraestructura y controles
        run: python -m pytest
      - name: Verificar bootstrap de PowerShell 5.1 sin instalar
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -File scripts/test-bootstrap.ps1
      - name: Verificar documentación y catálogo
        run: python -m framework.cli check
      - name: Verificar mapa Excel de cobertura vigente
        run: python -m framework.cli coverage --check
      - name: Validar suite sin abrir productos
        run: python -m framework.cli run --product xgestion --group regression --dry-run
      # Este workflow no recibe secretos ni publica artefactos de QA.
      # El dry-run no inicia XGestion, MySQL ni Java Access Bridge.
