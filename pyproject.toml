[project]
name = "xsoft-qa-e2e"
version = "0.1.0"
description = "Pruebas reproducibles para el equipo QA de Xsoft"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".local", "reports", "work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
